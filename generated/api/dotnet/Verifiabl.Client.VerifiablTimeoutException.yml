  name: VerifiablTimeoutException
  nameWithType: VerifiablTimeoutException
  fullName: Verifiabl.Client.VerifiablTimeoutException
  type: Class
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    Thrown when an API call exceeds <xref href="Verifiabl.Client.VerifiablClientOptions.Timeout" data-throw-if-not-resolved="false"></xref>.

    The deadline covers the whole operation: token fetch, request, the 401

    refresh, and every retry with its backoff.
  remarks: >-
    A cancellation you requested surfaces as <xref href="System.OperationCanceledException" data-throw-if-not-resolved="false"></xref>

    instead, so the two are never confused.
  example: []
  syntax:
    content: 'public sealed class VerifiablTimeoutException : VerifiablException, ISerializable'
    content.vb: Public NotInheritable Class VerifiablTimeoutException Inherits VerifiablException Implements ISerializable
