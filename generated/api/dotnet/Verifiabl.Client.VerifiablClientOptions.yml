- uid: Verifiabl.Client.VerifiablClientOptions.MaxRetries
  commentId: P:Verifiabl.Client.VerifiablClientOptions.MaxRetries
  id: MaxRetries
  parent: Verifiabl.Client.VerifiablClientOptions
  langs:
  - csharp
  - vb
  name: MaxRetries
  nameWithType: VerifiablClientOptions.MaxRetries
  fullName: Verifiabl.Client.VerifiablClientOptions.MaxRetries
  type: Property
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    Maximum automatic retries for a failed request, on top of the first

    attempt. Defaults to 2; set 0 to disable.
  remarks: >-
    Retries use exponential backoff with jitter and honour a

    <code>Retry-After</code> header. Calls that carry a client-generated reference

    (<xref href="Verifiabl.Client.IVerifiablClient.RegisterNonPiiAsync(Verifiabl.Client.RegisterNonPiiRequest%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>, which mints one per

    call, and <xref href="Verifiabl.Client.IVerifiablClient.RegisterNonPiiBatchAsync(System.Collections.Generic.IEnumerable%7bVerifiabl.Client.BatchRecord%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>)

    deduplicate on the server, so they retry on throttling, timeouts, 5xx,

    and network faults. <xref href="Verifiabl.Client.IVerifiablClient.RegisterAndBuildBarcodeAsync(Verifiabl.Client.RegisterAndBuildBarcodeRequest%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    uses a server-minted reference that cannot deduplicate a resend, so it

    retries only 429, which the API enforces before any processing. All

    retries share the call <xref href="Verifiabl.Client.VerifiablClientOptions.Timeout" data-throw-if-not-resolved="false"></xref> as an overall deadline.
  example: []
  syntax:
    content: public int MaxRetries { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property MaxRetries As Integer
  overload: Verifiabl.Client.VerifiablClientOptions.MaxRetries*
- uid: Verifiabl.Client.VerifiablClientOptions.HttpClient
  commentId: P:Verifiabl.Client.VerifiablClientOptions.HttpClient
  id: HttpClient
  parent: Verifiabl.Client.VerifiablClientOptions
  langs:
  - csharp
  - vb
  name: HttpClient
  nameWithType: VerifiablClientOptions.HttpClient
  fullName: Verifiabl.Client.VerifiablClientOptions.HttpClient
  type: Property
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    The <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> to send requests with; the SDK

    never disposes it. When unset, a shared internal client is used. The SDK

    manages its own per-request timeouts, so the supplied client's Timeout

    should be left at its default or set to infinite.
  remarks: >-
    The Verifiabl.Issuer.Extensions.DependencyInjection package wires this to

    IHttpClientFactory for you.
  example: []
  syntax:
    content: public HttpClient? HttpClient { get; set; }
    parameters: []
    return:
      type: System.Net.Http.HttpClient
    content.vb: Public Property HttpClient As HttpClient
  overload: Verifiabl.Client.VerifiablClientOptions.HttpClient*
