  langs:
  - csharp
  - vb
  name: IVerifiablClient
  nameWithType: IVerifiablClient
  fullName: Verifiabl.Client.IVerifiablClient
  type: Interface
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    The Verifiabl issuer API. Implemented by <xref href="Verifiabl.Client.VerifiablClient" data-throw-if-not-resolved="false"></xref>; take a

    dependency on this interface so tests can substitute a fake.
  remarks: >-
    <p>

    Every failure these methods report derives from <xref href="Verifiabl.VerifiablException" data-throw-if-not-resolved="false"></xref>,

    so one <code>catch (VerifiablException)</code> covers API errors, auth failures,

    timeouts, and transport faults. Invalid arguments still throw

    <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> before anything is sent, and cancelling the

    token you passed still throws <xref href="System.OperationCanceledException" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    Implementations cache OAuth tokens, so register a single instance and reuse it.

    </p>
  example: []
  syntax:
    content: public interface IVerifiablClient
    content.vb: Public Interface IVerifiablClient
  derivedClasses:
