  commentId: T:Verifiabl.Client.IVerifiablClient
  id: IVerifiablClient
  parent: Verifiabl.Client
  children:
  - Verifiabl.Client.IVerifiablClient.RegisterAndBuildBarcodeAsync(Verifiabl.Client.RegisterAndBuildBarcodeRequest,System.Threading.CancellationToken)
