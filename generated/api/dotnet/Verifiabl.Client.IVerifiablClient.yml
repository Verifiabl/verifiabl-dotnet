    - id: request
      type: Verifiabl.Client.RegisterNonPiiRequest
      description: The payslip registration.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the call.
    return:
      type: System.Threading.Tasks.Task{Verifiabl.Client.RegisterNonPiiResponse}
    content.vb: Function RegisterNonPiiAsync(request As RegisterNonPiiRequest, cancellationToken As CancellationToken = Nothing) As Task(Of RegisterNonPiiResponse)
  overload: Verifiabl.Client.IVerifiablClient.RegisterNonPiiAsync*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The request is incomplete or malformed.
  - type: Verifiabl.Client.VerifiablIvReuseException
    commentId: T:Verifiabl.Client.VerifiablIvReuseException
    description: The record's encryption IV is already registered to this issuer.
  - type: Verifiabl.Client.VerifiablApiException
    commentId: T:Verifiabl.Client.VerifiablApiException
    description: The API returned a non-2xx response.
  - type: Verifiabl.Client.VerifiablAuthException
    commentId: T:Verifiabl.Client.VerifiablAuthException
    description: An OAuth token could not be obtained.
  - type: Verifiabl.Client.VerifiablTimeoutException
    commentId: T:Verifiabl.Client.VerifiablTimeoutException
    description: The call exceeded the configured timeout.
