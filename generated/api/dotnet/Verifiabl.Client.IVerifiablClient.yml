  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    Register non-PII payslip data and decryption metadata. Returns the

    Verifiabl reference to embed in a locally generated barcode.
  example: []
  syntax:
