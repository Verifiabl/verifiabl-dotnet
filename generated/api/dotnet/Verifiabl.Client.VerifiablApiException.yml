  name: VerifiablApiException
  nameWithType: VerifiablApiException
  fullName: Verifiabl.Client.VerifiablApiException
  type: Class
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    Thrown for any non-2xx Verifiabl API response. Match on <xref href="Verifiabl.Client.VerifiablApiException.Code" data-throw-if-not-resolved="false"></xref>

    (stable) rather than <xref href="System.Exception.Message" data-throw-if-not-resolved="false"></xref> (may change).
  remarks: >-
    <p>

    <xref href="Verifiabl.Client.VerifiablApiException.Code" data-throw-if-not-resolved="false"></xref> is <xref href="Verifiabl.Client.VerifiablErrorCodes.InternalError" data-throw-if-not-resolved="false"></xref> when the

    response carried no parseable Verifiabl error body (e.g. a gateway error

    page); check <xref href="Verifiabl.Client.VerifiablApiException.Status" data-throw-if-not-resolved="false"></xref> for the raw HTTP status in that case.

    </p>

    <p>

    A few codes have their own derived type, currently only

    <xref href="Verifiabl.Client.VerifiablIvReuseException" data-throw-if-not-resolved="false"></xref>. Catching this type still covers them.

    The constructors are internal, so the SDK owns the whole hierarchy.

    </p>
  example: []
  syntax:
    content: 'public class VerifiablApiException : VerifiablException, ISerializable'
    content.vb: Public Class VerifiablApiException Inherits VerifiablException Implements ISerializable
  inheritance:
