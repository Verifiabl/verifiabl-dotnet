- uid: Verifiabl.Extensions.DependencyInjection.VerifiablServiceCollectionExtensions.AddVerifiablClient(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.Action{System.IServiceProvider,Verifiabl.Client.VerifiablClientOptions})
  commentId: M:Verifiabl.Extensions.DependencyInjection.VerifiablServiceCollectionExtensions.AddVerifiablClient(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.Action{System.IServiceProvider,Verifiabl.Client.VerifiablClientOptions})
  id: AddVerifiablClient(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.Action{System.IServiceProvider,Verifiabl.Client.VerifiablClientOptions})
  isExtensionMethod: true
  parent: Verifiabl.Extensions.DependencyInjection.VerifiablServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddVerifiablClient(IServiceCollection, Action<IServiceProvider, VerifiablClientOptions>)
  nameWithType: VerifiablServiceCollectionExtensions.AddVerifiablClient(IServiceCollection, Action<IServiceProvider, VerifiablClientOptions>)
  fullName: Verifiabl.Extensions.DependencyInjection.VerifiablServiceCollectionExtensions.AddVerifiablClient(Microsoft.Extensions.DependencyInjection.IServiceCollection, System.Action<System.IServiceProvider, Verifiabl.Client.VerifiablClientOptions>)
  type: Method
  assemblies:
  - Verifiabl.Extensions.DependencyInjection
  namespace: Verifiabl.Extensions.DependencyInjection
  summary: >-
    Register <xref href="Verifiabl.Client.IVerifiablClient" data-throw-if-not-resolved="false"></xref> as a singleton, configuring it from

    other registered services (for credentials pulled from your own

    configuration or secrets abstraction).
  remarks: >-
    The registration is a singleton because the client caches OAuth access

    tokens; a scoped or transient lifetime would fetch a token per resolve.

    Options are registered with the Microsoft.Extensions.Options pattern and

    ValidateOnStart, so hosts that run startup validation fail before serving

    traffic when the configured client options are invalid.

    Registration uses TryAdd semantics: once <xref href="Verifiabl.Client.IVerifiablClient" data-throw-if-not-resolved="false"></xref>

    is registered, later <code>AddVerifiablClient</code> calls are no-ops.
  example: []
  syntax:
    content: public static IServiceCollection AddVerifiablClient(this IServiceCollection services, Action<IServiceProvider, VerifiablClientOptions> configureOptions)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection.
    - id: configureOptions
      type: System.Action{System.IServiceProvider,Verifiabl.Client.VerifiablClientOptions}
      description: Configures the client options.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function AddVerifiablClient(services As IServiceCollection, configureOptions As Action(Of IServiceProvider, VerifiablClientOptions)) As IServiceCollection
