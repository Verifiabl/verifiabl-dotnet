- uid: Verifiabl.VerifiablReference.Generate
  commentId: M:Verifiabl.VerifiablReference.Generate
  id: Generate
  parent: Verifiabl.VerifiablReference
  langs:
  - csharp
  - vb
  name: Generate()
  nameWithType: VerifiablReference.Generate()
  fullName: Verifiabl.VerifiablReference.Generate()
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: >-
    Generate a fresh Verifiabl reference: 16 cryptographically random bytes

    (128 bits) encoded as 22 base64url characters without padding. Matches the

    server's algorithm, so a provider-generated reference is indistinguishable

    from one issued by the API.
  remarks: >-
    Use this for <xref href="Verifiabl.Client.VerifiablClient.RegisterNonPiiBatchAsync(System.Collections.Generic.IEnumerable%7bVerifiabl.Client.BatchRecord%7d%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>, where

    providers generate their own references up-front so a whole pay run can be

    submitted in one request. Single-record registration does not need it; the

    API generates a reference for you and returns it.
  example: []
  syntax:
    content: public static string Generate()
    return:
      type: System.String
    content.vb: Public Shared Function Generate() As String
  overload: Verifiabl.VerifiablReference.Generate*
