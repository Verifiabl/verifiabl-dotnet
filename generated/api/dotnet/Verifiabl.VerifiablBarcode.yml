- uid: Verifiabl.VerifiablBarcode.BuildPayload(Verifiabl.BarcodeParts)
  commentId: M:Verifiabl.VerifiablBarcode.BuildPayload(Verifiabl.BarcodeParts)
  id: BuildPayload(Verifiabl.BarcodeParts)
  parent: Verifiabl.VerifiablBarcode
  langs:
  - csharp
  - vb
  name: BuildPayload(BarcodeParts)
  nameWithType: VerifiablBarcode.BuildPayload(BarcodeParts)
  fullName: Verifiabl.VerifiablBarcode.BuildPayload(Verifiabl.BarcodeParts)
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: 'Build the default v2 barcode payload: <code>2|&lt;verifiablReference&gt;|&lt;Base32 ciphertext&gt;</code>.'
  remarks: >-
    This is the bare wire format, and the value to write into the PDF's XMP

    metadata. For QR codes intended to be scanned by phones, prefer

    <xref href="Verifiabl.VerifiablBarcode.BuildScanUrl(Verifiabl.BarcodeParts%2cVerifiabl.ScanUrlOptions)" data-throw-if-not-resolved="false"></xref>, which carries the same reference and

    ciphertext as a public scan-redirect URL.
  example: []
  syntax:
    content: public static string BuildPayload(BarcodeParts parts)
    parameters:
    - id: parts
      type: Verifiabl.BarcodeParts
    return:
      type: System.String
    content.vb: Public Shared Function BuildPayload(parts As BarcodeParts) As String
  overload: Verifiabl.VerifiablBarcode.BuildPayload*
- uid: Verifiabl.VerifiablBarcode.BuildScanUrl(Verifiabl.BarcodeParts,Verifiabl.ScanUrlOptions)
  commentId: M:Verifiabl.VerifiablBarcode.BuildScanUrl(Verifiabl.BarcodeParts,Verifiabl.ScanUrlOptions)
  id: BuildScanUrl(Verifiabl.BarcodeParts,Verifiabl.ScanUrlOptions)
  parent: Verifiabl.VerifiablBarcode
  langs:
  - csharp
  - vb
  name: BuildScanUrl(BarcodeParts, ScanUrlOptions?)
  nameWithType: VerifiablBarcode.BuildScanUrl(BarcodeParts, ScanUrlOptions?)
  fullName: Verifiabl.VerifiablBarcode.BuildScanUrl(Verifiabl.BarcodeParts, Verifiabl.ScanUrlOptions?)
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: >-
    Build the URL encoded into Verifiabl QR codes. The default is:

    <code>https://v.verifiabl.io/v/&lt;verifiablReference&gt;#2.&lt;Base32 ciphertext&gt;</code>.

    The scan URL sends scanners to Verifiabl instead of exposing raw ciphertext

    in a phone camera preview.
  remarks: >-
    The ciphertext rides in the fragment, which no client transmits to a

    server, so it cannot reach a request log at Verifiabl or at any

    intermediary. Every character stays inside the URI-safe Base32 or

    base64url alphabets plus <code>.</code>, which keeps scanners treating this as a URL and

    offering tap-to-open rather than showing it as plain text.
  example: []
  syntax:
    content: public static string BuildScanUrl(BarcodeParts parts, ScanUrlOptions? options = null)
    parameters:
    - id: parts
      type: Verifiabl.BarcodeParts
    - id: options
      type: Verifiabl.ScanUrlOptions
    return:
      type: System.String
    content.vb: Public Shared Function BuildScanUrl(parts As BarcodeParts, options As ScanUrlOptions = Nothing) As String
  overload: Verifiabl.VerifiablBarcode.BuildScanUrl*
  nameWithType.vb: VerifiablBarcode.BuildScanUrl(BarcodeParts, ScanUrlOptions)
  fullName.vb: Verifiabl.VerifiablBarcode.BuildScanUrl(Verifiabl.BarcodeParts, Verifiabl.ScanUrlOptions)
  name.vb: BuildScanUrl(BarcodeParts, ScanUrlOptions)
- uid: Verifiabl.VerifiablBarcode.CreateSvg(Verifiabl.BarcodeParts,Verifiabl.BarcodeSvgOptions)
  commentId: M:Verifiabl.VerifiablBarcode.CreateSvg(Verifiabl.BarcodeParts,Verifiabl.BarcodeSvgOptions)
  id: CreateSvg(Verifiabl.BarcodeParts,Verifiabl.BarcodeSvgOptions)
  parent: Verifiabl.VerifiablBarcode
  langs:
  - csharp
  - vb
  name: CreateSvg(BarcodeParts, BarcodeSvgOptions?)
  nameWithType: VerifiablBarcode.CreateSvg(BarcodeParts, BarcodeSvgOptions?)
  fullName: Verifiabl.VerifiablBarcode.CreateSvg(Verifiabl.BarcodeParts, Verifiabl.BarcodeSvgOptions?)
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: >-
    Render the branded Verifiabl barcode as a standalone SVG suitable for

    embedding in a payslip PDF.
  remarks: >-
    Takes the Verifiabl reference from <xref href="Verifiabl.Client.VerifiablClient.RegisterNonPiiAsync(Verifiabl.Client.RegisterNonPiiRequest%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    and the encrypted PII ciphertext from <xref href="Verifiabl.VerifiablCrypto.EncryptPii(System.String%2cSystem.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref>.

    SVG scales to any size without losing quality; if your document pipeline

    needs a raster image, use <xref href="Verifiabl.VerifiablBarcode.CreatePng(Verifiabl.BarcodeParts%2cVerifiabl.BarcodeSvgOptions%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> rather than rasterising

    the SVG yourself, so module edges stay crisp and scannable.
  example: []
  syntax:
    content: public static BarcodeSvgResult CreateSvg(BarcodeParts parts, BarcodeSvgOptions? options = null)
    parameters:
    - id: parts
      type: Verifiabl.BarcodeParts
    - id: options
      type: Verifiabl.BarcodeSvgOptions
    return:
      type: Verifiabl.BarcodeSvgResult
    content.vb: Public Shared Function CreateSvg(parts As BarcodeParts, options As BarcodeSvgOptions = Nothing) As BarcodeSvgResult
  overload: Verifiabl.VerifiablBarcode.CreateSvg*
  nameWithType.vb: VerifiablBarcode.CreateSvg(BarcodeParts, BarcodeSvgOptions)
  fullName.vb: Verifiabl.VerifiablBarcode.CreateSvg(Verifiabl.BarcodeParts, Verifiabl.BarcodeSvgOptions)
  name.vb: CreateSvg(BarcodeParts, BarcodeSvgOptions)
- uid: Verifiabl.VerifiablBarcode.CreatePng(Verifiabl.BarcodeParts,Verifiabl.BarcodeSvgOptions,System.Int32)
  commentId: M:Verifiabl.VerifiablBarcode.CreatePng(Verifiabl.BarcodeParts,Verifiabl.BarcodeSvgOptions,System.Int32)
  id: CreatePng(Verifiabl.BarcodeParts,Verifiabl.BarcodeSvgOptions,System.Int32)
  parent: Verifiabl.VerifiablBarcode
  langs:
  - csharp
  - vb
  name: CreatePng(BarcodeParts, BarcodeSvgOptions?, int)
  nameWithType: VerifiablBarcode.CreatePng(BarcodeParts, BarcodeSvgOptions?, int)
  fullName: Verifiabl.VerifiablBarcode.CreatePng(Verifiabl.BarcodeParts, Verifiabl.BarcodeSvgOptions?, int)
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: Render the branded Verifiabl barcode as a PNG.
  remarks: >-
    The PNG is composited deterministically from a pre-rasterised frame plus

    exact pixel-aligned QR modules - no vector rasteriser and no native

    dependencies - so the same record produces the byte-identical raster in

    every Verifiabl SDK. Because the frame is pre-rasterised, PNG output

    exists only at pixel widths 480, 720, 960 and 1440; the physical print

    size is set where the image is placed in the PDF. If you need a

    different size, prefer <xref href="Verifiabl.VerifiablBarcode.CreateSvg(Verifiabl.BarcodeParts%2cVerifiabl.BarcodeSvgOptions)" data-throw-if-not-resolved="false"></xref>, which scales

    continuously. <xref href="Verifiabl.BarcodeSvgOptions.Width" data-throw-if-not-resolved="false"></xref> is ignored here;

    <code class="paramref">pixelWidth</code> controls the bitmap size.
  example: []
  syntax:
    content: public static BarcodePngResult CreatePng(BarcodeParts parts, BarcodeSvgOptions? options = null, int pixelWidth = 720)
    parameters:
    - id: parts
      type: Verifiabl.BarcodeParts
      description: The Verifiabl reference and encrypted PII ciphertext.
    - id: options
      type: Verifiabl.BarcodeSvgOptions
      description: Scan URL and error-correction options.
    - id: pixelWidth
      type: System.Int32
      description: 'Output bitmap width in pixels (default: 720).'
    return:
      type: Verifiabl.BarcodePngResult
    content.vb: Public Shared Function CreatePng(parts As BarcodeParts, options As BarcodeSvgOptions = Nothing, pixelWidth As Integer = 720) As BarcodePngResult
  overload: Verifiabl.VerifiablBarcode.CreatePng*
  nameWithType.vb: VerifiablBarcode.CreatePng(BarcodeParts, BarcodeSvgOptions, Integer)
  fullName.vb: Verifiabl.VerifiablBarcode.CreatePng(Verifiabl.BarcodeParts, Verifiabl.BarcodeSvgOptions, Integer)
  name.vb: CreatePng(BarcodeParts, BarcodeSvgOptions, Integer)
