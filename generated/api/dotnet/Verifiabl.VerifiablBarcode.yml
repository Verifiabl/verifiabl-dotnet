- uid: Verifiabl.VerifiablBarcode.PdfPayloadXmpNamespace
  commentId: F:Verifiabl.VerifiablBarcode.PdfPayloadXmpNamespace
  id: PdfPayloadXmpNamespace
  parent: Verifiabl.VerifiablBarcode
  langs:
  - csharp
  - vb
  name: PdfPayloadXmpNamespace
  nameWithType: VerifiablBarcode.PdfPayloadXmpNamespace
  fullName: Verifiabl.VerifiablBarcode.PdfPayloadXmpNamespace
  type: Field
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: >-
    XMP namespace for the PDF metadata copy of the barcode payload. The

    namespace is permanent: it is embedded in already-issued PDFs, so it must

    not change.
  remarks: >-
    Write the barcode payload (<xref href="Verifiabl.VerifiablBarcode.BuildPayload(Verifiabl.BarcodeParts)" data-throw-if-not-resolved="false"></xref>) into the payslip

    PDF's XMP metadata in addition to the QR code, so a verifier can read the

    payload even when the QR itself cannot be scanned. Both hold the identical

    encrypted <code>2|verifiablReference|&lt;Base32 ciphertext&gt;</code> value by default; never

    write plaintext PII to metadata, which is not encrypted. Write the value

    with any PDF toolchain that can set a custom XMP property; the SDK only

    provides the keys.
  example: []
  syntax:
    content: public const string PdfPayloadXmpNamespace = "https://verifiabl.io/ns/"
    return:
      type: System.String
    content.vb: Public Const PdfPayloadXmpNamespace As String = "https://verifiabl.io/ns/"
