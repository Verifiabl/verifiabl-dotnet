items:
- uid: Verifiabl.Client.VerifiablIvReuseException
  commentId: T:Verifiabl.Client.VerifiablIvReuseException
  id: VerifiablIvReuseException
  parent: Verifiabl.Client
  children: []
  langs:
  - csharp
  - vb
  name: VerifiablIvReuseException
  nameWithType: VerifiablIvReuseException
  fullName: Verifiabl.Client.VerifiablIvReuseException
  type: Class
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    Thrown when a single registration is rejected because the record's

    encryption IV is already registered to your issuer. Derives from

    <xref href="Verifiabl.Client.VerifiablApiException" data-throw-if-not-resolved="false"></xref> with <xref href="Verifiabl.Client.VerifiablApiException.Code" data-throw-if-not-resolved="false"></xref>

    of <xref href="Verifiabl.Client.VerifiablErrorCodes.IvReused" data-throw-if-not-resolved="false"></xref>, so an existing

    <code>catch (VerifiablApiException)</code> still covers it.
  remarks: >-
    <p>

    <xref href="Verifiabl.VerifiablCrypto.EncryptPii(System.String%2cSystem.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref> draws a fresh IV on every call, so

    this occurs when stored encryption metadata is sent again with new content.

    </p>

    <p>

    The SDK does not re-encrypt and retry for you. Encrypt the payslip again,

    resend the record with the new encryption metadata, and rebuild any barcode

    that you rendered from the previous ciphertext. Resending the record

    unchanged gives the same result.

    </p>
  example: []
  syntax:
    content: 'public sealed class VerifiablIvReuseException : VerifiablApiException, ISerializable'
    content.vb: Public NotInheritable Class VerifiablIvReuseException Inherits VerifiablApiException Implements ISerializable
  inheritance:
  - System.Object
  - System.Exception
