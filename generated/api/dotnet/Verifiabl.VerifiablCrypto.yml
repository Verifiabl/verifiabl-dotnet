- uid: Verifiabl.VerifiablCrypto.EncryptPii(System.String,System.Byte[])
  commentId: M:Verifiabl.VerifiablCrypto.EncryptPii(System.String,System.Byte[])
  id: EncryptPii(System.String,System.Byte[])
  parent: Verifiabl.VerifiablCrypto
  langs:
  - csharp
  - vb
  name: EncryptPii(string, byte[])
  nameWithType: VerifiablCrypto.EncryptPii(string, byte[])
  fullName: Verifiabl.VerifiablCrypto.EncryptPii(string, byte[])
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: >-
    Encrypt a formatted PII string with AES-256-GCM. The GCM authentication

    tag, returned in the metadata, lets the verifier detect any tampering with

    the ciphertext at scan time.
  remarks: >-
    Every call draws a fresh random IV, which is what keeps AES-256-GCM safe

    under one key. Never store the returned

    <xref href="Verifiabl.EncryptedPii.Metadata" data-throw-if-not-resolved="false"></xref> and send it again with different

    content: registration rejects a repeated IV as

    <xref href="Verifiabl.Client.VerifiablIvReuseException" data-throw-if-not-resolved="false"></xref>, or in a batch as an error

    result matched by <xref href="Verifiabl.Client.BatchRecordResult.IsIvReused" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static EncryptedPii EncryptPii(string plaintext, byte[] key)
    parameters:
    - id: plaintext
      type: System.String
      description: The formatted string from <xref href="Verifiabl.Pii.Format(Verifiabl.PiiFields)" data-throw-if-not-resolved="false"></xref>.
    - id: key
      type: System.Byte[]
      description: Your 32-byte provider encryption key.
    return:
      type: Verifiabl.EncryptedPii
    content.vb: Public Shared Function EncryptPii(plaintext As String, key As Byte()) As EncryptedPii
