- uid: Verifiabl.Client.VerifiablAuth.ClientCredentials(System.String,System.String,System.Uri)
  commentId: M:Verifiabl.Client.VerifiablAuth.ClientCredentials(System.String,System.String,System.Uri)
  id: ClientCredentials(System.String,System.String,System.Uri)
  parent: Verifiabl.Client.VerifiablAuth
  langs:
  - csharp
  - vb
  name: ClientCredentials(string, string, Uri?)
  nameWithType: VerifiablAuth.ClientCredentials(string, string, Uri?)
  fullName: Verifiabl.Client.VerifiablAuth.ClientCredentials(string, string, System.Uri?)
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: OAuth2 client credentials issued by Verifiabl during onboarding.
  example: []
  syntax:
    content: public static VerifiablAuth ClientCredentials(string clientId, string clientSecret, Uri? tokenUrl = null)
    parameters:
    - id: clientId
      type: System.String
      description: OAuth client ID.
    - id: clientSecret
      type: System.String
      description: OAuth client secret. Load from a secrets manager; never hard-code it.
    - id: tokenUrl
      type: System.Uri
      description: >-
        OAuth token endpoint (default: the environment's auth service, e.g.

        https://auth.verifiabl.io/oauth/token). Overrides must use a Verifiabl

        auth host, or localhost for local development.
    return:
      type: Verifiabl.Client.VerifiablAuth
    content.vb: Public Shared Function ClientCredentials(clientId As String, clientSecret As String, tokenUrl As Uri = Nothing) As VerifiablAuth
