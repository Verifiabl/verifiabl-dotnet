- uid: Verifiabl.Pii.Parse(System.String)
  commentId: M:Verifiabl.Pii.Parse(System.String)
  id: Parse(System.String)
  parent: Verifiabl.Pii
  langs:
  - csharp
  - vb
  name: Parse(string)
  nameWithType: Pii.Parse(string)
  fullName: Verifiabl.Pii.Parse(string)
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: >-
    Parse Verifiabl's compact PII wire format back into named fields. Empty

    segments are left <code>null</code>, mirroring Verifiabl's scan-time behaviour.
  remarks: >-
    Useful for round-trip testing your integration; not needed in the normal

    issuance flow.
  example: []
  syntax:
    content: public static PiiFields Parse(string plaintext)
    parameters:
    - id: plaintext
      type: System.String
    return:
      type: Verifiabl.PiiFields
    content.vb: Public Shared Function Parse(plaintext As String) As PiiFields
  overload: Verifiabl.Pii.Parse*
  exceptions:
  - type: System.FormatException
    commentId: T:System.FormatException
    description: The input is not a valid P1 or P2 PII string.
  nameWithType.vb: Pii.Parse(String)
  fullName.vb: Verifiabl.Pii.Parse(String)
  name.vb: Parse(String)
