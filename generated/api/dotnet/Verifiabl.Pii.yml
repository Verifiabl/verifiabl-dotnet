  name: Pii
  nameWithType: Pii
  fullName: Verifiabl.Pii
  type: Class
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: Formats employee PII into Verifiabl's compact plaintext wire format and back.
  remarks: >-
    The wire format is a pipe-delimited plaintext string. It is encrypted before

    being embedded in the barcode and is never sent to the Verifiabl API in

    plaintext.


    <xref href="Verifiabl.Pii.Format(Verifiabl.PiiFields)" data-throw-if-not-resolved="false"></xref> retains the existing P2 compatibility layout.

    <xref href="Verifiabl.Pii.FormatAustralian(Verifiabl.AustralianPiiFields)" data-throw-if-not-resolved="false"></xref> and

    <xref href="Verifiabl.Pii.FormatNewZealand(Verifiabl.NewZealandPiiFields)" data-throw-if-not-resolved="false"></xref> write the AU2 and NZ2

    jurisdiction profiles.


    Legacy P1 plaintext remains readable through <xref href="Verifiabl.Pii.Parse(System.String)" data-throw-if-not-resolved="false"></xref> for existing

    documents, but cannot be generated.
  example: []
  syntax:
    content: public static class Pii
    content.vb: Public Module Pii
