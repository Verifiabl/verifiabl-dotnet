- uid: Verifiabl.Client.VerifiablClient.RegisterNonPiiBatchAsync(System.Collections.Generic.IEnumerable{Verifiabl.Client.BatchRecord},System.Threading.CancellationToken)
  commentId: M:Verifiabl.Client.VerifiablClient.RegisterNonPiiBatchAsync(System.Collections.Generic.IEnumerable{Verifiabl.Client.BatchRecord},System.Threading.CancellationToken)
  id: RegisterNonPiiBatchAsync(System.Collections.Generic.IEnumerable{Verifiabl.Client.BatchRecord},System.Threading.CancellationToken)
  parent: Verifiabl.Client.VerifiablClient
  langs:
  - csharp
  - vb
  name: RegisterNonPiiBatchAsync(IEnumerable<BatchRecord>, CancellationToken)
  nameWithType: VerifiablClient.RegisterNonPiiBatchAsync(IEnumerable<BatchRecord>, CancellationToken)
  fullName: Verifiabl.Client.VerifiablClient.RegisterNonPiiBatchAsync(System.Collections.Generic.IEnumerable<Verifiabl.Client.BatchRecord>, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    Register a batch of non-PII payslip records in a single request, up to

    <xref href="Verifiabl.Client.VerifiablClient.MaxBatchRecords" data-throw-if-not-resolved="false"></xref> records. Each record carries a

    provider-generated Verifiabl reference (from

    <xref href="Verifiabl.VerifiablReference.Generate" data-throw-if-not-resolved="false"></xref>) and the same fields as

    <xref href="Verifiabl.Client.IVerifiablClient.RegisterNonPiiAsync(Verifiabl.Client.RegisterNonPiiRequest%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>. The response contains a per-record

    result index-aligned to the input: one bad record never fails the batch.

    A record whose encryption IV is already registered to this issuer, or is

    repeated within this batch, comes back as an error result matched by

    <xref href="Verifiabl.Client.BatchRecordResult.IsIvReused" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public Task<RegisterNonPiiBatchResponse> RegisterNonPiiBatchAsync(IEnumerable<BatchRecord> records, CancellationToken cancellationToken = default)
    parameters:
    - id: records
      type: System.Collections.Generic.IEnumerable{Verifiabl.Client.BatchRecord}
      description: The records to register.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the call.
    return:
      type: System.Threading.Tasks.Task{Verifiabl.Client.RegisterNonPiiBatchResponse}
    content.vb: Public Function RegisterNonPiiBatchAsync(records As IEnumerable(Of BatchRecord), cancellationToken As CancellationToken = Nothing) As Task(Of RegisterNonPiiBatchResponse)
  overload: Verifiabl.Client.VerifiablClient.RegisterNonPiiBatchAsync*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">records</code> is null.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The batch is empty, oversized, or a record is malformed.
  - type: Verifiabl.Client.VerifiablApiException
    commentId: T:Verifiabl.Client.VerifiablApiException
    description: The API returned a non-2xx response.
  - type: Verifiabl.Client.VerifiablAuthException
    commentId: T:Verifiabl.Client.VerifiablAuthException
    description: An OAuth token could not be obtained.
  - type: Verifiabl.Client.VerifiablTimeoutException
    commentId: T:Verifiabl.Client.VerifiablTimeoutException
    description: The call exceeded the configured timeout.
  - type: Verifiabl.Client.VerifiablTransportException
    commentId: T:Verifiabl.Client.VerifiablTransportException
    description: A network fault prevented a response, or the response was not usable JSON.
  - type: System.OperationCanceledException
    commentId: T:System.OperationCanceledException
    description: <code class="paramref">cancellationToken</code> was cancelled.
  implements:
