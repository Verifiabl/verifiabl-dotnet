  name: VerifiablClient
  nameWithType: VerifiablClient
  fullName: Verifiabl.Client.VerifiablClient
  type: Class
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: Typed client for the Verifiabl issuer API.
  remarks: >-
    <p>

    With OAuth client credentials the client fetches, caches, and refreshes

    access tokens automatically; a request that fails with 401 is retried exactly

    once with a fresh token. The client is thread-safe and intended to be created

    once and reused.

    </p>

    <p>

    Every failure an API call reports derives from <xref href="Verifiabl.VerifiablException" data-throw-if-not-resolved="false"></xref>,

    so one <code>catch (VerifiablException)</code> covers API errors, auth failures,

    timeouts, and transport faults.

    </p>

    <p>

    Depend on <xref href="Verifiabl.Client.IVerifiablClient" data-throw-if-not-resolved="false"></xref> where you need to substitute a fake.

    </p>
