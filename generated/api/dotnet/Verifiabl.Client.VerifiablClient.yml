  nameWithType.vb: VerifiablClient.RegisterNonPiiBatchAsync(IEnumerable(Of BatchRecord), CancellationToken)
  fullName.vb: Verifiabl.Client.VerifiablClient.RegisterNonPiiBatchAsync(System.Collections.Generic.IEnumerable(Of Verifiabl.Client.BatchRecord), System.Threading.CancellationToken)
  name.vb: RegisterNonPiiBatchAsync(IEnumerable(Of BatchRecord), CancellationToken)
