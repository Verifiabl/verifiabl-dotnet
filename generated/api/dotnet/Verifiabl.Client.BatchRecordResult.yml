- uid: Verifiabl.Client.BatchRecordResult.IsIvReused
  commentId: P:Verifiabl.Client.BatchRecordResult.IsIvReused
  id: IsIvReused
  parent: Verifiabl.Client.BatchRecordResult
  langs:
  - csharp
  - vb
  name: IsIvReused
  nameWithType: BatchRecordResult.IsIvReused
  fullName: Verifiabl.Client.BatchRecordResult.IsIvReused
  type: Property
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    True when the API rejected this record because its encryption IV is already

    registered to your issuer, either against a stored record or against an

    earlier record in the same batch (that first record still registers).
  remarks: >-
    <p>

    The two cases differ only in <xref href="Verifiabl.Client.BatchRecordResult.Detail" data-throw-if-not-resolved="false"></xref>, so match on this rather

    than on the wording.

    </p>

    <p>

    The SDK does not re-encrypt and resubmit the record for you. Encrypt the

    payslip again with <xref href="Verifiabl.VerifiablCrypto.EncryptPii(System.String%2cSystem.Byte%5b%5d)" data-throw-if-not-resolved="false"></xref> to get a new

    IV, resend the record with the new encryption metadata, and rebuild any

    barcode that you rendered from the previous ciphertext. Resending the

    record unchanged gives the same result.

    </p>
  example: []
  syntax:
    content: public bool IsIvReused { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public ReadOnly Property IsIvReused As Boolean
  overload: Verifiabl.Client.BatchRecordResult.IsIvReused*
