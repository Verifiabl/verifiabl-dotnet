  name: BatchRecordResult
  nameWithType: BatchRecordResult
  fullName: Verifiabl.Client.BatchRecordResult
  type: Class
  assemblies:
  - Verifiabl
  namespace: Verifiabl.Client
  summary: >-
    Per-record outcome of a batch registration, in the same order as the

    submitted records (so <code>Results[i]</code> is the outcome of record <code>i</code>).

    <xref href="Verifiabl.Client.BatchRecordResult.Code" data-throw-if-not-resolved="false"></xref> and <xref href="Verifiabl.Client.BatchRecordResult.Detail" data-throw-if-not-resolved="false"></xref> accompany an "error" status.

    One bad record never fails the whole batch. Correlate by position, by the

    record's <xref href="Verifiabl.Client.BatchRecordResult.ExternalId" data-throw-if-not-resolved="false"></xref>, or by <xref href="Verifiabl.Client.BatchRecordResult.VerifiablReference" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public sealed class BatchRecordResult
    content.vb: Public NotInheritable Class BatchRecordResult
