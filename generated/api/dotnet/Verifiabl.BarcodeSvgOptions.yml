- uid: Verifiabl.BarcodeSvgOptions.MaxErrorCorrection
  commentId: P:Verifiabl.BarcodeSvgOptions.MaxErrorCorrection
  id: MaxErrorCorrection
  parent: Verifiabl.BarcodeSvgOptions
  langs:
  - csharp
  - vb
  name: MaxErrorCorrection
  nameWithType: BarcodeSvgOptions.MaxErrorCorrection
  fullName: Verifiabl.BarcodeSvgOptions.MaxErrorCorrection
  type: Property
  assemblies:
  - Verifiabl
  namespace: Verifiabl
  summary: >-
    Highest QR error-correction level to use: <xref href="Verifiabl.BarcodeErrorCorrectionLevel.Low" data-throw-if-not-resolved="false"></xref>,

    <xref href="Verifiabl.BarcodeErrorCorrectionLevel.Medium" data-throw-if-not-resolved="false"></xref> (the default), or

    <xref href="Verifiabl.BarcodeErrorCorrectionLevel.Quartile" data-throw-if-not-resolved="false"></xref>. The renderer still

    steps below this only when the payload would not otherwise fit the fixed frame.
  remarks: >-
    Medium (~15% damage recovery) balances module size and recovery. Choose

    Low (~7% recovery) to make dense payload modules larger, accepting less

    resilience to wear. Choose Quartile (~25% recovery) for documents expected

    to take heavy print wear, accepting a denser code (one or two QR versions

    larger).
  example: []
  syntax:
    content: public BarcodeErrorCorrectionLevel MaxErrorCorrection { get; set; }
    parameters: []
    return:
      type: Verifiabl.BarcodeErrorCorrectionLevel
    content.vb: Public Property MaxErrorCorrection As BarcodeErrorCorrectionLevel
  overload: Verifiabl.BarcodeSvgOptions.MaxErrorCorrection*
