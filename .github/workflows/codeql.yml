name: CodeQL

# Static analysis (SAST) on every PR and on main, per the ISMS SDLC
# policy requirement that SAST and SCA run before merge (SCA is the
# audit job in ci.yml).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 18 * * 1" # weekly, Tuesday 04:30 AEST

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required for CodeQL to read the workflow run while the repo is private;
      # a no-op once the repo is public (public repos grant it implicitly).
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # CodeQL scans C# without a build; no .NET setup needed.
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
