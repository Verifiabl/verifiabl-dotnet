name: Release

# Publishes to NuGet.org when a GitHub release is published.
#
# Auth uses NuGet.org Trusted Publishing (OIDC): the workflow exchanges a
# short-lived GitHub OIDC token for a temporary NuGet API key, so there is no
# long-lived token secret. One-time setup on nuget.org:
#   profile → Trusted Publishing → add policy:
#     Repository Owner: Verifiabl
#     Repository: verifiabl-dotnet
#     Workflow File: release.yml
#     Environment: nuget-publish
# Configure Trusted Publishing for both package ids before the first renamed
# release: Verifiabl.Issuer and Verifiabl.Issuer.Extensions.DependencyInjection.
# The NUGET_USER repository secret holds the nuget.org profile name that owns
# the trusted publishing policy (the profile name, not an email address).
#
# The nuget-publish GitHub environment (repo Settings → Environments) requires
# a reviewer approval, so publishing a GitHub release alone cannot push to
# NuGet.org without a human confirming the deployment.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages*.lock.json') }}
      # The validator and target policy are shipped with this repository.
      - name: Resolve and validate the release target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/release-tool.mjs validate-checkout "$TAG"
      - run: dotnet restore --locked-mode
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      - run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      # Tests gate every publish, mirroring the CI pipeline.
      - run: dotnet test --configuration Release --no-build
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      # Pack commands and the coupled package set come from the generated target config.
      - run: node .github/scripts/release-tool.mjs pack "$RELEASE_TARGET_ID" "$VERSION"
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Duplicates fail deliberately: a reused tag or partial rerun must never look successful.
      - name: Push coupled packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
